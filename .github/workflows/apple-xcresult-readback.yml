# Read only the exact prior failed result; never builds or creates a Simulator.
name: Apple exact xcresult readback

on:
  push:
    branches: [diag/apple-original-54090-20261116]
    paths: ['.github/workflows/apple-xcresult-readback.yml']

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Decode exact failed xcresult with its installed Apple tool
        run: |
          python - <<'PY'
          import datetime, hashlib, importlib.util, json, os, signal, stat, uuid, zipfile
          from pathlib import Path, PurePosixPath
          spec = importlib.util.spec_from_file_location("xcresult_read_owner", "scripts/apple.py")
          api = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(api)
          env = dict(os.environ)
          run = Path(env["RUNNER_TEMP"]) / ("weftext-xcresult-readback-" + env["GITHUB_RUN_ID"]) / str(uuid.uuid4())
          run.mkdir(parents=True)
          record = {"kind": "read-only-exact-failed-xcresult", "state": "running", "commands": [],
              "startedUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "sourceCommit": env["GITHUB_SHA"], "failedRun": 43758683824, "inputArtifactId": 14180155655,
              "inputArtifactSha256": "b38a02ae2e82b519a67a75bcefc6ca849a663d58a579b64b8f28bec6fbf6453e",
              "deviceCreationRequested": False, "buildRequested": False,
              "testsPassed": False, "runtimeValidated": False, "productValidated": False}
          def terminate(signum, _frame):
              signal.signal(signum, signal.SIG_IGN)
              raise SystemExit(128 + signum)
          for name in ("SIGTERM", "SIGHUP"):
              signal.signal(getattr(signal, name), terminate)
          def digest(path):
              with path.open("rb") as source:
                  return hashlib.file_digest(source, "sha256").hexdigest()
          def object_json(text):
              start = text.index("{")
              return json.JSONDecoder().raw_decode(text[start:])[0]
          try:
              artifact = run / "original-artifact.zip"
              api.run_command(["/bin/bash", "-c",
                  'gh api repos/ZHYX91/weftext/actions/artifacts/14180155655/zip > "$1"',
                  "artifact-output", str(artifact)], run, "download-exact-artifact", env, 120, record, run)
              if artifact.stat().st_size != 61347827 or digest(artifact) != record["inputArtifactSha256"]:
                  raise ValueError("Original input artifact bytes do not match the frozen failed run")
              nested = run / "original-xcresult.zip"
              with zipfile.ZipFile(artifact) as archive:
                  candidates = [item for item in archive.infolist()
                      if item.filename.endswith("/roles/ios-simulator.xcresult.zip")]
                  if len(candidates) != 1 or candidates[0].file_size != 60761616:
                      raise ValueError("Original xcresult role is missing or ambiguous")
                  with archive.open(candidates[0]) as source, nested.open("xb") as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
              if digest(nested) != "100275ecb9b846a7586f7b041d7b6c4698d895571cde929662c6e4631d7ae1eb":
                  raise ValueError("Original xcresult archive identity mismatch")
              destination = run / "read-only-input-copy"
              destination.mkdir()
              with zipfile.ZipFile(nested) as archive:
                  items = archive.infolist()
                  if len(items) != 1029 or sum(item.file_size for item in items) != 60943919:
                      raise ValueError("Unexpected frozen xcresult archive shape")
                  seen = set()
                  for item in items:
                      relative = PurePosixPath(item.filename)
                      if (relative.is_absolute() or ".." in relative.parts or not relative.parts
                              or relative.parts[0] != "ios-simulator.xcresult" or item.filename in seen
                              or stat.S_ISLNK(item.external_attr >> 16)):
                          raise ValueError("Unsupported original result archive member")
                      seen.add(item.filename)
                      target = destination.joinpath(*relative.parts)
                      if not target.resolve().is_relative_to(destination.resolve()):
                          raise ValueError("Original archive member escaped the owned reader copy")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(item) as source, target.open("xb") as output:
                          while chunk := source.read(1024 * 1024):
                              output.write(chunk)
              tool_reply = api.run_command(["/usr/bin/xcrun", "--find", "xcresulttool"], run,
                                            "resolve-xcresulttool", env, 30, record, run)
              reported = Path(tool_reply.strip())
              tool = reported.resolve(strict=True)
              if not reported.is_absolute() or tool.name != "xcresulttool" or not tool.is_relative_to(Path(env["DEVELOPER_DIR"]).resolve()):
                  raise ValueError("Result reader tool is outside the selected Xcode")
              record["selectedTool"] = api.selected_tool_record(reported, tool)
              bundle = destination / "ios-simulator.xcresult"
              summary = api.run_command([str(tool), "get", "test-results", "summary", "--path", str(bundle)],
                                        run, "xcresult-summary", env, 60, record, run)
              legacy = api.run_command([str(tool), "get", "object", "--legacy", "--format", "json", "--path", str(bundle)],
                                       run, "xcresult-original-issues", env, 60, record, run)
              parsed_summary, parsed_legacy = object_json(summary), object_json(legacy)
              actions = parsed_legacy.get("actions", {}).get("_values")
              if not isinstance(actions, list) or len(actions) != 1:
                  raise ValueError("Expected one original action; retain raw reader logs")
              issues = actions[0].get("actionResult", {}).get("issues", {})
              failures = issues.get("testFailureSummaries", {}).get("_values")
              if (not isinstance(failures, list) or len(failures) != 1
                      or parsed_summary.get("totalTestCount") != 15 or parsed_summary.get("passedTests") != 14
                      or parsed_summary.get("failedTests") != 1 or parsed_summary.get("skippedTests") != 0):
                  raise ValueError("Original 14/15 failure identity is unavailable; retain raw reader logs")
              failed_tests = parsed_summary.get("testFailures")
              if (not isinstance(failed_tests, list) or len(failed_tests) != 1
                      or failed_tests[0].get("testIdentifierString") !=
                          "NativeWebSurfaceTests/testTrustedMainFramePreservesExactEnvelopeAndReplyBytes()"):
                  raise ValueError("Unexpected failed case; do not guess a test identifier")
              test_id = failed_tests[0].get("testIdentifierURL")
              if test_id != "test://com.apple.xcode/WeftextAppleHost/WeftextAppleHostTests/NativeWebSurfaceTests/testTrustedMainFramePreservesExactEnvelopeAndReplyBytes":
                  raise ValueError("Original failed-case URL is unavailable")
              (run / "actual-failure-summaries.json").write_text(json.dumps({
                  "failedRun": record["failedRun"], "inputArtifactSha256": record["inputArtifactSha256"],
                  "summary": parsed_summary, "legacyActionFailureCount": len(failures),
                  "originalLegacyFailureObjects": failures}, ensure_ascii=False, indent=2) + "\n", encoding="utf8")
              record["failedCaseIdentifier"] = test_id
              for subcommand in ("test-details", "activities"):
                  help_text = api.run_command([str(tool), "help", "get", "test-results", subcommand],
                                             run, "help-" + subcommand, env, 30, record, run)
                  if "--test-id" not in help_text or "--path" not in help_text:
                      raise ValueError("Selected tool lacks the explicit failed-case read contract")
                  api.run_command([str(tool), "get", "test-results", subcommand, "--path", str(bundle),
                                   "--test-id", test_id], run, "failed-case-" + subcommand, env, 60, record, run)
              availability = api.run_command([str(tool), "get", "content-availability", "--path", str(bundle)],
                                             run, "xcresult-content-availability", env, 60, record, run)
              record["contentAvailability"] = object_json(availability)
              diagnostics_help = api.run_command([str(tool), "help", "export", "diagnostics"],
                                                run, "help-export-diagnostics", env, 30, record, run)
              if "--path" not in diagnostics_help or "--output-path" not in diagnostics_help:
                  raise ValueError("Selected tool lacks the explicit diagnostics export contract")
              diagnostics = run / "derived-diagnostics"
              if os.path.lexists(diagnostics):
                  raise ValueError("Diagnostics output was already occupied")
              api.run_command([str(tool), "export", "diagnostics", "--path", str(bundle),
                               "--output-path", str(diagnostics)], run, "export-original-diagnostics", env, 60, record, run)
              manifest = []
              logical_bytes = 0
              if os.path.lexists(diagnostics):
                  root_identity = diagnostics.lstat()
                  root = diagnostics.resolve(strict=True)
                  if (not stat.S_ISDIR(root_identity.st_mode) or stat.S_ISLNK(root_identity.st_mode)
                          or not root.is_relative_to(run.resolve())):
                      raise ValueError("Unsupported exported diagnostic root")
                  node_count = 0
                  for path in diagnostics.rglob("*"):
                      node_count += 1
                      if node_count > 4096:
                          raise ValueError("Too many exported diagnostic nodes")
                      identity = path.lstat()
                      if stat.S_ISLNK(identity.st_mode) or not path.resolve().is_relative_to(root):
                          raise ValueError("Unsupported exported diagnostic boundary")
                      if stat.S_ISDIR(identity.st_mode):
                          continue
                      if not stat.S_ISREG(identity.st_mode):
                          raise ValueError("Unsupported exported diagnostic file type")
                      logical_bytes += identity.st_size
                      if len(manifest) >= 2000 or logical_bytes > 128 * 1024 * 1024:
                          raise ValueError("Exported diagnostics exceed the bounded reader plan")
                      manifest.append({"path": path.relative_to(diagnostics).as_posix(),
                                       "bytes": identity.st_size, "sha256": digest(path)})
              manifest.sort(key=lambda item: item["path"])
              (run / "diagnostics-manifest.json").write_text(json.dumps({
                  "source": "xcresulttool export diagnostics on exact original copy", "files": manifest,
                  "logicalBytes": logical_bytes, "scope": "Existing data only; absent data remains absent"},
                  ensure_ascii=False, indent=2) + "\n", encoding="utf8")
              if manifest:
                  current_root = diagnostics.lstat()
                  if ((current_root.st_dev, current_root.st_ino) != (root_identity.st_dev, root_identity.st_ino)
                          or not stat.S_ISDIR(current_root.st_mode) or stat.S_ISLNK(current_root.st_mode)
                          or diagnostics.resolve(strict=True) != root):
                      raise ValueError("Exported diagnostic root changed before archiving")
                  exported_archive = run / "derived-diagnostics.zip"
                  with zipfile.ZipFile(exported_archive, "x", compression=zipfile.ZIP_DEFLATED) as output:
                      for item in manifest:
                          output.write(diagnostics / item["path"], arcname=item["path"])
                  record["derivedDiagnostics"] = {"files": len(manifest), "logicalBytes": logical_bytes,
                      "archive": exported_archive.name, "bytes": exported_archive.stat().st_size,
                      "sha256": digest(exported_archive)}
              else:
                  record["derivedDiagnostics"] = {"files": 0, "status": "No exported diagnostics observed"}
              record["originalArtifactUnchanged"] = digest(artifact) == record["inputArtifactSha256"]
              record["originalXcresultArchiveUnchanged"] = digest(nested) == "100275ecb9b846a7586f7b041d7b6c4698d895571cde929662c6e4631d7ae1eb"
              if not record["originalArtifactUnchanged"] or not record["originalXcresultArchiveUnchanged"]:
                  raise ValueError("Original reader input archive changed")
              record.update(state="read-only-decoded", legacyActionFailureCount=len(failures))
          except BaseException as error:
              record.update(state="failed", failure=f"{type(error).__name__}: {error}")
              raise
          finally:
              api.save(run, record)
          PY
      - name: Preserve only derived reader outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-xcresult-readback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/weftext-xcresult-readback-${{ github.run_id }}/**/result.json
            ${{ runner.temp }}/weftext-xcresult-readback-${{ github.run_id }}/**/*.log
            ${{ runner.temp }}/weftext-xcresult-readback-${{ github.run_id }}/**/actual-failure-summaries.json
            ${{ runner.temp }}/weftext-xcresult-readback-${{ github.run_id }}/**/diagnostics-manifest.json
            ${{ runner.temp }}/weftext-xcresult-readback-${{ github.run_id }}/**/derived-diagnostics.zip
          if-no-files-found: error
          retention-days: 7
