name: Product checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      - run: npm --prefix app test
      - run: npm --prefix app run build
      - run: git diff --exit-code

  windows-product:
    name: Windows product gate
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain
        run: |
          cargo --version
          rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: windows-cargo-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build once and run the existing product checks
        run: python scripts/mvp.py check
      - run: git diff --exit-code
