name: Product checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python scripts/mvp.py check --group frontend
      - run: git diff --exit-code

  windows-product:
    name: Windows product gate
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain
        run: |
          cargo --version
          rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/x86_64-pc-windows-msvc
            target/.weftext-cargo-inputs.json
          key: windows-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: windows-cargo-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Acquire exact locked official materials and select compatible installed tools
        id: inputs
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP']) / (
              'weftext-inputs-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          root.mkdir(exist_ok=False)
          preparation = root / 'preparation.json'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8', newline='\n') as output:
              output.write(f'root={root}\npreparation={preparation}\n')
          subprocess.run([sys.executable, 'scripts/prepare_windows_package.py',
              '--materials', str(root / 'materials'), '--output', str(preparation)], check=True)
          record = json.loads(preparation.read_text(encoding='utf-8'))
          if record['status'] != 'preparedInputsOnly':
              raise ValueError('Input preparation did not qualify')
          expected = {'CARGO_BUILD_TARGET', 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER',
              'WEFTEXT_WINDOWS_SDK_BIN', 'LIB', 'INCLUDE', 'PATH'}
          if set(record['environment']) != expected:
              raise ValueError('Unexpected prepared compiler environment')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
              for key, value in record['environment'].items():
                  if not isinstance(value, str) or any(char in value for char in '\r\n'):
                      raise ValueError('Prepared environment contains a newline')
                  output.write(f'{key}={value}\n')
      - name: Initialize this attempt's original evidence without building
        id: evidence
        run: python scripts/ci_windows_package.py init
      - name: Build the canonical release package, verify its receipt independently and run every original check
        id: package
        env:
          WEFTEXT_CI_EVIDENCE: ${{ steps.evidence.outputs.evidence }}
          WEFTEXT_CI_PREPARATION: ${{ steps.inputs.outputs.preparation }}
          TEMP: ${{ steps.evidence.outputs.temp }}
          TMP: ${{ steps.evidence.outputs.temp }}
        run: python scripts/ci_windows_package.py package --evidence "$env:WEFTEXT_CI_EVIDENCE" --preparation "$env:WEFTEXT_CI_PREPARATION"
      - run: git diff --exit-code
      - name: Retain original controls and exact new package identities
        id: collect
        if: always() && steps.evidence.outputs.evidence != ''
        env:
          WEFTEXT_CI_EVIDENCE: ${{ steps.evidence.outputs.evidence }}
        run: python scripts/ci_windows_package.py collect --evidence "$env:WEFTEXT_CI_EVIDENCE"
      - name: Retain this attempt's unsigned review artifacts and original evidence
        if: always() && steps.inputs.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.inputs.outputs.root }}/*.json
            ${{ steps.inputs.outputs.root }}/materials/*.json
            ${{ steps.collect.outputs.paths }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve identities if evidence collection itself failed
        if: always() && steps.evidence.outputs.evidence != '' && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.evidence.outputs.evidence }}/*.json
            ${{ steps.evidence.outputs.evidence }}/process-controls.zip
            ${{ steps.evidence.outputs.evidence }}/receipt-cli.stdout.bin
            ${{ steps.evidence.outputs.evidence }}/receipt-cli.stderr.bin
          if-no-files-found: error
          retention-days: 7
      - name: Preserve input originals when no complete package was generated
        if: always() && steps.inputs.outputs.root != '' && steps.package.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-input-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.inputs.outputs.root }}
          if-no-files-found: error
          retention-days: 7
