[workspace]
members = ["crates/weftext-app", "crates/weftext-core", "crates/weftext-engine", "crates/weftext-data", "crates/weftext-knowledge", "crates/weftext-export", "crates/weftext-messages", "crates/weftext-enrollment"]
resolver = "2"

[patch.crates-io]
typst-html = { path = "crates/weftext-engine/vendor/typst-html" }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
codegen-units = 16
strip = "debuginfo"

