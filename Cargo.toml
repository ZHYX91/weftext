[workspace]
members = ["crates/weftext-app", "crates/weftext-core", "crates/weftext-engine", "crates/weftext-data", "crates/weftext-knowledge", "crates/weftext-export", "crates/weftext-messages", "crates/weftext-enrollment", "crates/weftext-worker-broker"]
resolver = "2"

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[patch.crates-io]
typst-html = { path = "crates/weftext-engine/vendor/typst-html" }

[profile.dev]
debug = 0

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 2
codegen-units = 16
strip = "debuginfo"

