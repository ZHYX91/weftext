[package]
name = "weftext-desktop"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Windows desktop shell for Weftext"

[lib]
name = "weftext_desktop"
crate-type = ["rlib"]

[[bin]]
name = "weftext-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
uuid.workspace = true
weftext-agent = { path = "../../../crates/weftext-agent" }
weftext-agent-dsh = { path = "../../../crates/weftext-agent-dsh" }
weftext-agent-mcp = { path = "../../../crates/weftext-agent-mcp" }
weftext-backup = { path = "../../../crates/weftext-backup" }
weftext-core = { path = "../../../crates/weftext-core" }
weftext-export = { path = "../../../crates/weftext-export" }
weftext-import = { path = "../../../crates/weftext-import" }
weftext-intake = { path = "../../../crates/weftext-intake" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-dialog = "=2.4.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
