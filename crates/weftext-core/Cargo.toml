[package]
name = "weftext-core"
version = "0.7.0-rc.5"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
weftext-messages = { path = "../weftext-messages" }
weftext-enrollment = { path = "../weftext-enrollment" }
weftext-export = { path = "../weftext-export" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
weftext-engine = { path = "../weftext-engine" }
weftext-knowledge = { path = "../weftext-knowledge" }
weftext-data = { path = "../weftext-data" }
typst-syntax = "=0.15.1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
hmac = "0.12"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
memmap2 = "0.9"
