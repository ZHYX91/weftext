[package]
name = "weftext-core"
version = "0.6.3-rc.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
weftext-export = { path = "../weftext-export" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
weftext-engine = { path = "../weftext-engine" }
weftext-knowledge = { path = "../weftext-knowledge" }
weftext-data = { path = "../weftext-data" }
typst-syntax = "=0.15.1"
url = "2"

[dev-dependencies]
tempfile = "3"
memmap2 = "0.9"
