[package]
name = "weftext-data"
version = "0.7.0-rc.2"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
weftext-messages = { path = "../weftext-messages" }
weftext-engine = { path = "../weftext-engine" }
typst-syntax = "=0.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = "1.43"
num-bigint = "0.4"
cel = { version = "=0.15.0", default-features = false }
uuid = "1"

[dev-dependencies]
typst = "=0.15.1"
tempfile = "3"
