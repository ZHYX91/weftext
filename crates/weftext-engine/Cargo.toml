[package]
name = "weftext-engine"
version = "0.7.0-rc.7"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
weftext-messages = { path = "../weftext-messages" }
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
base64 = "0.22"
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
typst-syntax = "=0.15.1"
typst-assets = {version="=0.15.1", features=["fonts"]}
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
