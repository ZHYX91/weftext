[package]
name = "weftext-export"
version = "0.7.0-rc.3"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
weftext-messages = { path = "../weftext-messages" }
weftext-engine = { path = "../weftext-engine" }
weftext-data = { path = "../weftext-data" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
base64 = "0.22"
unicode-normalization = "0.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
biblatex = "0.12.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
