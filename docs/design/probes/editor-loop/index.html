<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weftext · 编辑闭环实验</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202b36;background:#edf1f5}body{margin:0}header{padding:20px 30px;background:#163042;color:white}h1{font-size:22px;margin:0 0 8px}header p{margin:0;color:#c8d7e0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 30px;background:white;border-bottom:1px solid #ccd4dc}button{padding:9px 12px;border:1px solid #b4c0cb;border-radius:7px;background:white;color:#243846;cursor:pointer}button[aria-pressed=true]{background:#176b63;color:white;border-color:#176b63}main{max-width:1050px;margin:20px auto;padding:0 20px}.notice{font-size:13px;color:#53626c;line-height:1.7}.sheet{min-height:240px;background:white;border:1px solid #ccd4dc;border-radius:10px;padding:25px;margin-top:12px}.sheet h2{font-size:26px}#source{box-sizing:border-box;width:100%;min-height:300px;resize:vertical;border:0;font:16px/1.8 Consolas,"Microsoft YaHei",monospace;outline:none}#visibleSource{white-space:pre-wrap;font:16px/1.8 Consolas,"Microsoft YaHei",monospace}#visibleSource .heading{font-weight:700;font-size:25px}#visibleSource .strong{font-weight:700}#visibleSource .emph{font-style:italic}#flow{font-size:17px;line-height:1.9}#flow [contenteditable=true]{outline:1px dashed #91b9b2;min-width:8px}#flow [contenteditable=true]:focus{outline:2px solid #267f72;background:#f0faf5}#flow [data-origin]{cursor:text}#flow .readonly{background:#f5f5f5}#flow table{border-collapse:collapse}#flow td{border:1px solid #ddd;padding:8px}#focusSource{width:100%;min-height:85px;font:16px/1.7 Consolas,monospace}#status{padding:12px 0;font-size:14px}details{margin-top:20px}pre{white-space:pre-wrap;font-size:12px}.hidden{display:none!important}.badge{font:12px system-ui;color:#677}.toolbar{display:flex;gap:8px;margin:12px 0}
</style>
<header><h1>Weftext · 编辑闭环实验</h1><p>一份 Typst 源 · 真实编译来源 · 有限可写范围</p></header>
<nav aria-label="视图"><button data-mode="1">V01 源码</button><button data-mode="2">V02 语法常显</button><button data-mode="3">V03 按需语法</button><button data-mode="4">V04 隐藏语法</button><button data-mode="5">V05 阅读</button></nav>
<main><p class="notice">仅操作独立实验目录中的 note.typ。普通字面正文、标题、强调与列表用于来源回写；包含代码的文档保留源码入口。此页面不代表完整五档、IME 或产品验收。</p>
<div class="toolbar"><button id="undo">撤销</button><button id="redo">重做</button><button id="save">保存实验文件</button><button id="restore">恢复本机草稿</button></div>
<div id="status" role="status">正在打开…</div><section class="sheet"><textarea id="source" aria-label="Typst 源码" spellcheck="false"></textarea><div id="visibleSource" class="hidden" contenteditable="true" role="textbox" aria-label="语法常显编辑" spellcheck="false"></div><div id="flow" class="hidden" aria-label="渲染文档"></div></section>
<section id="focusPanel" class="sheet hidden"><label for="focusSource">当前构造的源码</label><textarea id="focusSource"></textarea><button id="applyFocus">应用到同一草稿</button></section>
<details><summary>编译与来源诊断</summary><pre id="diagnostic"></pre></details></main><script type="module" src="/app.mjs"></script></html>
