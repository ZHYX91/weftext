# Weftext-owned DSH JSON-RPC composition for read-only workspace access.
#
# Required environment:
# - WEFTEXT_BIN: absolute path to the native `weftext` executable
# - WEFTEXT_WORKSPACE: absolute path to the one granted Weftext workspace root
# - DSH_SESSION_ROOT: optional control-plane directory for DSH session JSONL
# - DEEPSEEK_API_KEY: supplied through the deployment's credential policy
#
# This composition intentionally mounts no Bash, shell, filesystem, skill,
# subagent, job-control, goal, or Weftext mutation tool.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeRuntimeContext: false
    persona: |-
      You are the read-only Weftext assistant. Use only the Weftext MCP tools
      to inspect the explicitly granted workspace. Never claim to edit, save,
      move, delete, or otherwise mutate workspace content.
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: mcp-weftext
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: weftext
    transport: stdio
    command: !!js process.env.WEFTEXT_BIN
    args:
      - agent
      - mcp
      - serve
      - !!js process.env.WEFTEXT_WORKSPACE
    env: {}
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.weftext-dsh-sessions'
    compression: none
